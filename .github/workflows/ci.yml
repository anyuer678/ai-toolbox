name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile scripts/server.py
      - name: Check no ACAO *
        run: |
          ! grep -q "Access-Control-Allow-Origin.*['\"]\*['\"]" scripts/server.py
          echo "PASS: no wildcard CORS"
      - name: Check bind 127.0.0.1
        run: |
          grep -q "127.0.0.1" scripts/server.py
          echo "PASS: bind localhost"

      - name: Unit tests
        run: |
          pip install pytest
          python -m pytest tests -q
